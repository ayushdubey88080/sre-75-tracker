<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const DAYS = D.days, PH = D.phases;
const ST = {'':'Not started', prog:'In progress', done:'Completed', rev:'Needs revision'};
const BLOCKS = ['Concepts and theory','Hands-on lab','Coding, troubleshooting and revision'];
const KEY = 'sre75-progress-v1';

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return el;
}
const $ = s => document.querySelector(s);
const phaseOf = id => PH.find(p => p.id === id);
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);

/* ---------- state ---------- */
function blank(){ return {v:1, days:{}, score:{}, qb:{}, port:{}, updated:0}; }
function loadLocal(){
  try { const s = localStorage.getItem(KEY); if (s) return Object.assign(blank(), JSON.parse(s)); } catch(e){}
  return blank();
}
let state = loadLocal();
function ds(n){ return state.days[n] || {s:'', b:[0,0,0], lab:{}, rv:{}, note:''}; }
function wds(n){ if (!state.days[n]) state.days[n] = {s:'', b:[0,0,0], lab:{}, rv:{}, note:''}; return state.days[n]; }
function persistLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function save(){ state.updated = Date.now(); persistLocal(); scheduleRemote(); }

/* ---------- remote (account) storage ---------- */
let remote = null, writing = false, pending = false, timer = null;
function setSync(mode){
  const el = $('#sync');
  el.textContent = mode === 'account' ? 'Progress saves to your Claude account, so it follows you across devices.'
    : mode === 'error' ? 'Could not reach your account just now; progress is saved in this browser.'
    : 'Progress saves in this browser.';
}
function scheduleRemote(){ if (!remote) return; clearTimeout(timer); timer = setTimeout(flush, 1200); }
async function flush(){
  if (!remote) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await remote.set({json: JSON.stringify(state), updated: state.updated}); setSync('account'); }
  catch(e){ setSync('error'); }
  writing = false;
  if (pending){ pending = false; flush(); }
}
async function initRemote(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    remote = db.doc('data/users/' + uid + '/progress');
    const snap = await remote.get();
    let r = null;
    if (snap.exists){ try { r = JSON.parse(snap.data().json); } catch(e){ r = null; } }
    if (r && (r.updated||0) > (state.updated||0)){
      state = Object.assign(blank(), r); persistLocal(); renderAll();
    } else if (state.updated){ flush(); }
    setSync('account');
  } catch(e){ remote = null; }
}

/* ---------- strip & summary ---------- */
let selected = null;
function counts(list){
  const c = {'':0, prog:0, done:0, rev:0};
  for (const d of list) c[ds(d.n).s || '']++;
  return c;
}
function nextDay(){
  const d = DAYS.find(d => ds(d.n).s !== 'done');
  return d || DAYS[DAYS.length-1];
}
function renderStrip(){
  const strip = $('#strip'); strip.textContent = '';
  for (const p of PH){
    const ds_ = DAYS.filter(d => d.ph === p.id);
    const bars = h('div', {class:'bars'});
    for (const d of ds_){
      const s = ds(d.n).s || '';
      bars.appendChild(h('button', {class:'bar' + (selected === d.n ? ' sel' : ''), type:'button', 'data-s':s, 'data-n':d.n,
        title:'Day ' + d.n + ': ' + d.topic + ' (' + ST[s] + ')', 'aria-label':'Day ' + d.n + ', ' + d.topic + ', ' + ST[s],
        onclick:() => { showView('plan'); select(d.n, true); }}));
    }
    strip.appendChild(h('div', {class:'grp', style:'flex:' + ds_.length + ' 1 0'}, bars, h('div', {class:'glabel', title:p.name}, p.short)));
  }
}
function renderSummary(){
  const c = counts(DAYS);
  const pct = Math.round(c.done / DAYS.length * 100);
  const parts = [c.done + ' of 75 days completed (' + pct + '%)'];
  if (c.prog) parts.push(c.prog + ' in progress');
  if (c.rev) parts.push(c.rev + ' to revise');
  $('#sumtext').textContent = parts.join(', ') + '.';
  const nd = nextDay();
  const nb = $('#nextbtn');
  nb.textContent = c.done === DAYS.length ? 'All 75 days complete. Open Day 75' : 'Continue with Day ' + nd.n + ': ' + nd.topic;
  nb.onclick = () => { showView('plan'); select(nd.n, true); };
}

/* ---------- today panel ---------- */
function renderToday(){
  const t = today();
  const due = DAYS.filter(d => { const x = ds(d.n); return x.s === 'done' && x.doneAt && [1,3,7,14].includes(daysBetween(x.doneAt, t)); });
  const rev = DAYS.filter(d => ds(d.n).s === 'rev');
  const box = $('#today'); box.textContent = '';
  const mk = (title, desc, arr, emptyText) => h('div', {class:'tcard'},
    h('h3', null, title), h('p', null, arr.length ? desc : emptyText),
    arr.length ? h('div', {class:'links'}, arr.slice(0, 12).map(d => h('button', {class:'lk', type:'button', onclick:() => select(d.n, true)},
      h('span', {class:'dot', 'data-s':ds(d.n).s}), 'Day ' + d.n))) : null);
  box.appendChild(mk('Spaced review due today', 'Completed 1, 3, 7 or 14 days ago. Skim the revision checklist and re-answer one interview question.', due, 'Nothing due. Days you complete come back here after 1, 3, 7 and 14 days.'));
  box.appendChild(mk('Marked for revision', 'Redo the key lab step and the DSA problem, then mark Completed again.', rev, 'No days marked for revision. Use it whenever an assessment exposes a gap.'));
}

/* ---------- list ---------- */
let fStatus = 'all', fPhase = 'all', fq = '';
function matches(d){
  const s = ds(d.n).s || '';
  if (fStatus !== 'all' && s !== fStatus) return false;
  if (fPhase !== 'all' && String(d.ph) !== fPhase) return false;
  if (fq){
    const hay = (d.topic + ' ' + d.con.join(' ') + ' ' + d.cmd + ' ' + d.dsa.join(' ')).toLowerCase();
    if (!fq.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
function renderChips(){
  const box = $('#schips'); box.textContent = '';
  const c = counts(DAYS);
  const opts = [['all','All ' + DAYS.length], ['','Not started ' + c['']], ['prog','In progress ' + c.prog], ['done','Completed ' + c.done], ['rev','Needs revision ' + c.rev]];
  for (const [k, label] of opts){
    box.appendChild(h('button', {class:'chip', type:'button', 'aria-pressed': String(fStatus === k), onclick:() => { fStatus = k; renderChips(); renderList(); }}, label));
  }
}
function renderList(){
  const list = $('#list'); list.textContent = '';
  let any = false;
  for (const p of PH){
    const items = DAYS.filter(d => d.ph === p.id && matches(d));
    if (!items.length) continue;
    any = true;
    list.appendChild(h('div', {class:'ph'}, 'Phase ' + p.id + ': ' + p.name));
    for (const d of items){
      list.appendChild(h('button', {class:'drow' + (selected === d.n ? ' sel' : ''), type:'button', 'data-n':d.n, onclick:() => select(d.n, true)},
        h('span', {class:'n'}, 'D' + d.n), h('span', null, d.topic), h('span', {class:'dot', 'data-s':ds(d.n).s || '', 'aria-label':ST[ds(d.n).s || '']})));
    }
  }
  if (!any) list.appendChild(h('p', {class:'empty'}, 'No days match these filters. Clear the search or pick "All".'));
}

/* ---------- detail ---------- */
function setStatus(n, s){
  const x = wds(n);
  x.s = s; x.at = today();
  if (s === 'done') x.doneAt = today(); else delete x.doneAt;
  save(); refresh(n);
}
function touch(n){ const x = wds(n); if (!x.s){ x.s = 'prog'; x.at = today(); } }
function codeBlock(text){
  const btn = h('button', {class:'copy', type:'button'}, 'Copy');
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
    catch(e){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected'; }
    setTimeout(() => btn.textContent = 'Copy', 1600);
  });
  const pre = h('pre', null, h('code', null, text));
  return h('div', {class:'code'}, btn, pre);
}
function concept(c){
  const i = c.indexOf(': ');
  if (i > 0 && i < 48) return h('li', null, h('strong', null, c.slice(0, i) + ':'), ' ' + c.slice(i + 2));
  return h('li', null, c);
}
function sec(title, ...kids){ return h('div', {class:'sec'}, h('h3', null, title), ...kids); }
function renderDetail(n){
  const d = DAYS.find(x => x.n === n); if (!d) return;
  const x = ds(n), p = phaseOf(d.ph);
  const mins = d.time.split('/').map(s => parseInt(s, 10));
  const box = $('#detail'); box.textContent = '';

  box.appendChild(h('div', {class:'dhead'},
    h('p', {class:'kicker'}, 'Day ', h('span', {class:'dnum'}, String(n)), ' of 75, Phase ' + p.id + ': ' + p.name),
    h('h2', {id:'dtitle'}, d.topic)));

  box.appendChild(h('div', {class:'status', role:'group', 'aria-label':'Status for day ' + n},
    Object.keys(ST).map(k => h('button', {class:'sbtn', id:'st-' + (k || 'none'), type:'button', 'data-s':k, 'aria-pressed': String((x.s||'') === k), onclick:() => setStatus(n, k)},
      h('span', {class:'dot', 'data-s':k}), ST[k]))));

  box.appendChild(h('div', {class:'blocks'}, BLOCKS.map((label, i) => {
    const on = !!(x.b && x.b[i]);
    return h('label', {class:'block' + (on ? ' on' : ''), style:'flex:' + mins[i] + ' 1 0'},
      h('input', {type:'checkbox', id:'blk' + i, checked:on, onchange:(e) => { const w = wds(n); w.b = w.b || [0,0,0]; w.b[i] = e.target.checked ? 1 : 0; if (e.target.checked) touch(n); save(); refresh(n); }}),
      h('span', null, h('b', null, mins[i] + ' min'), label));
  })));
  const metaBits = [];
  if (x.at) metaBits.push('Status last changed ' + x.at);
  if (x.doneAt) metaBits.push('completed ' + x.doneAt);
  box.appendChild(h('p', {class:'meta'}, metaBits.length ? metaBits.join(', ') + '.' : 'Tick each block as you finish it. Ticking anything marks the day In progress.'));

  const ta = h('textarea', {id:'note', placeholder:'What you built, what broke, your assessment score, questions to revisit'});
  ta.value = x.note || '';
  ta.addEventListener('input', () => { wds(n).note = ta.value; save(); });
  box.appendChild(h('div', {class:'notes'}, h('label', {for:'note'}, 'Your notes for this day'), ta));

  box.appendChild(sec('Learning objectives', h('ul', null, d.obj.map(o => h('li', null, o)))));
  box.appendChild(sec('Concepts', h('ul', null, d.con.map(concept))));
  box.appendChild(sec('Commands, code and configuration', codeBlock(d.cmd)));
  box.appendChild(sec('Hands-on lab', h('ol', {class:'checks'}, d.lab.map((s, i) => {
    const ok = !!(x.lab && x.lab[i]);
    return h('li', {class: ok ? 'ok' : ''},
      h('input', {type:'checkbox', id:'lab'+i, checked:ok, 'aria-label':'Lab step ' + (i+1) + ' done', onchange:(e) => { const w = wds(n); w.lab = w.lab || {}; w.lab[i] = e.target.checked; if (e.target.checked) touch(n); save(); refresh(n); }}),
      h('span', {class:'stepn'}, String(i+1)), h('span', {class:'txt'}, s));
  }))));
  box.appendChild(sec('Expected output and verification', codeBlock(d.ver)));
  box.appendChild(sec('Production scenario', h('p', {class:'scenario'}, d.inc)));
  box.appendChild(sec('DSA practice', h('ul', null, d.dsa.map(s => h('li', null, s)))));
  box.appendChild(sec('Interview questions, basic to advanced', h('ol', null, d.iq.map(q => h('li', null, q)))));
  box.appendChild(sec('Revision checklist', h('ul', {class:'checks'}, d.rev.map((r, i) => {
    const ok = !!(x.rv && x.rv[i]);
    return h('li', {class: ok ? 'ok' : ''},
      h('input', {type:'checkbox', id:'rv' + i, checked:ok, 'aria-label':'Revised: ' + r, onchange:(e) => { const w = wds(n); w.rv = w.rv || {}; w.rv[i] = e.target.checked; save(); refresh(n); }}),
      h('span', {class:'txt'}, r));
  }))));
  box.appendChild(sec('Done when', h('p', {class:'donewhen'}, d.done)));
  box.appendChild(sec('Documentation and free resources', h('ul', null, d.res.map(r => h('li', null, h('a', {href:r.u, target:'_blank', rel:'noopener'}, r.t))))));

  const prev = DAYS.find(z => z.n === n - 1), next = DAYS.find(z => z.n === n + 1);
  box.appendChild(h('div', {class:'pager'},
    h('button', {type:'button', disabled: !prev, onclick:() => prev && select(prev.n, true)}, prev ? 'Previous: Day ' + prev.n : 'Start of roadmap'),
    h('button', {type:'button', disabled: !next, onclick:() => next && select(next.n, true)}, next ? 'Next: Day ' + next.n : 'End of roadmap')));
}
function select(n, scroll){
  selected = n;
  try { history.replaceState(null, '', '#day-' + n); } catch(e){}
  renderDetail(n); renderList(); renderStrip();
  if (scroll){
    const det = $('#detail');
    const r = det.getBoundingClientRect();
    if (window.innerWidth <= 900 || r.top < 0 || r.top > window.innerHeight * 0.6) det.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    const row = document.querySelector('.drow.sel'); if (row && window.innerWidth > 900) row.scrollIntoView({block:'nearest'});
  }
}
function refresh(n){
  // keep focus position: re-render detail only when not typing
  const ae = document.activeElement, id = ae && ae.id;
  renderDetail(n); renderList(); renderStrip(); renderSummary(); renderToday(); renderChips(); renderOverview();
  if (id){ const el = document.getElementById(id); if (el) el.focus(); }
}

/* ---------- views ---------- */
function showView(v){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === v)));
  document.querySelectorAll('section.view').forEach(s => s.hidden = s.id !== 'v-' + v);
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showView(t.dataset.v)));

function renderOverview(){
  const box = $('#v-overview'); box.textContent = '';
  box.appendChild(h('div', {class:'prose'},
    h('h2', null, 'Nine phases, 75 days'),
    h('p', null, 'Each day is about three hours: concepts first, then a lab, then coding, troubleshooting or revision. DSA runs every day from Day 1, with a weekly assessment on Days 7, 14, 21, 28, 35, 42, 49, 56, 63 and 70. Day 27 is a recovery day for catching up. Interview practice is built into every day through the five questions; Days 71 to 75 are full mock rounds.'),
    h('p', null, 'Mark a day Needs revision whenever an assessment shows a gap. Completed days come back for spaced review after 1, 3, 7 and 14 days on the Daily plan tab.')));
  const wrap = h('div', {class:'phases'});
  for (const p of PH){
    const items = DAYS.filter(d => d.ph === p.id), c = counts(items), tot = items.length;
    const seg = (k, color) => c[k] ? h('i', {style:'width:' + (c[k]/tot*100) + '%;background:var(--' + color + ')'}) : null;
    wrap.appendChild(h('div', {class:'phase'},
      h('div', {class:'pn'}, String(p.id)),
      h('div', null, h('h3', null, p.name + ', Days ' + p.days[0] + ' to ' + p.days[1]), h('p', null, p.goal)),
      h('div', {class:'pp'}, h('div', {class:'pbar'}, seg('done','done'), seg('prog','prog'), seg('rev','rev')),
        h('div', {class:'pstat'}, c.done + ' of ' + tot + ' completed'))));
  }
  box.appendChild(wrap);
}
function renderProjects(){
  const box = $('#v-projects'); box.textContent = '';
  box.appendChild(h('div', {class:'prose'}, h('h2', null, 'Portfolio projects'),
    h('p', null, 'Each project builds on the last and reuses the same small service, status-api, so your effort compounds. Prefer local tools (kind, Docker); cloud resources that can cost money are called out with cleanup steps.')));
  for (const p of D.projects){
    const list = (title, arr) => h('div', null, h('h4', null, title), h('ul', null, arr.map(s => h('li', null, s))));
    box.appendChild(h('div', {class:'proj'},
      h('h3', null, p.name), h('p', {class:'when'}, p.days),
      h('p', {class:'prose', style:'margin:0'}, p.arch),
      h('div', {class:'cols'}, list('Milestones', p.milestones), list('Validation', p.validation), list('Failure scenarios to test', p.failures), list('README must include', p.readme)),
      p.cost ? h('p', {class:'cost'}, h('strong', null, 'Cost and cleanup: '), p.cost) : null));
  }
}
function renderQuestions(){
  const box = $('#v-questions'); box.textContent = '';
  box.appendChild(h('div', {class:'prose'}, h('h2', null, 'Mock interview question bank'),
    h('p', null, 'Tick a question once you can answer it aloud in under three minutes without notes. Each day also has five progressive questions of its own.')));
  for (const cat in D.qbank){
    const qs = D.qbank[cat], got = state.qb[cat] || {};
    const done = qs.filter((_, i) => got[i]).length;
    box.appendChild(h('div', {class:'qcat'},
      h('h3', null, cat, h('small', null, done + ' of ' + qs.length + ' practised')),
      h('ul', {class:'checks'}, qs.map((q, i) => h('li', {class: got[i] ? 'ok' : ''},
        h('input', {type:'checkbox', checked: !!got[i], 'aria-label':'Practised: ' + q, onchange:(e) => { state.qb[cat] = state.qb[cat] || {}; state.qb[cat][i] = e.target.checked; save(); renderQuestions(); }}),
        h('span', {class:'txt'}, q))))));
  }
}
function renderScore(){
  const box = $('#v-score'); box.textContent = '';
  box.appendChild(h('div', {class:'prose'}, h('h2', null, 'Final readiness scorecard'),
    h('p', null, 'Score yourself after each weekly assessment and again on Day 75. Be strict: score what you can do unseen and under time pressure, not what you recognise. Completing the roadmap builds fundamentals and evidence; it does not guarantee an offer.')));
  box.appendChild(h('div', {class:'rubric'}, D.rubric.map(r => h('div', null, h('b', null, r.level + '. ' + r.name), r.desc))));
  const rows = D.areas.map(a => {
    const v = state.score[a] || 0;
    return h('tr', null, h('td', null, h('strong', null, a)),
      h('td', null, h('div', {class:'lvl', role:'group', 'aria-label':'Score for ' + a}, [1,2,3,4].map(l => h('button', {type:'button', 'aria-pressed': String(v === l), title: D.rubric[l-1].name,
        onclick:() => { state.score[a] = (v === l ? 0 : l); save(); renderScore(); }}, String(l))))),
      h('td', null, v ? D.rubric[v-1].name : 'Not scored'));
  });
  box.appendChild(h('div', {class:'tablewrap'}, h('table', {class:'score'}, h('thead', null, h('tr', null, h('th', null, 'Area'), h('th', null, 'Level'), h('th', null, 'Meaning'))), h('tbody', null, rows))));
  const vals = D.areas.map(a => state.score[a] || 0).filter(Boolean);
  const avg = vals.length ? (vals.reduce((s, v) => s + v, 0) / vals.length) : 0;
  const low = D.areas.filter(a => (state.score[a] || 0) && state.score[a] < 3);
  box.appendChild(h('p', {class:'overall'}, vals.length
    ? 'Average ' + avg.toFixed(1) + ' across ' + vals.length + ' scored areas. ' + (low.length ? 'Below interview-ready: ' + low.join(', ') + '. Plan 30 more days on these.' : (vals.length === D.areas.length && avg >= 3 ? 'Every area is at interview-ready or above.' : ''))
    : 'Score each area 1 to 4 using the rubric above.'));
  box.appendChild(h('div', {class:'levels'}, D.levels.map(l => h('div', null, h('h3', null, l.title), h('ul', null, l.items.map(s => h('li', null, s)))))));
}
function renderResources(){
  const box = $('#v-resources'); box.textContent = '';
  box.appendChild(h('div', {class:'prose'}, h('h2', null, 'Free resources'),
    h('p', null, 'Official documentation first. Each day also links the most relevant pages for that topic.')));
  box.appendChild(h('div', {class:'tablewrap'}, h('table', {class:'res'}, h('tbody', null, D.resources.map(r => h('tr', null, h('td', null, r[0]), h('td', null, h('a', {href:r[2], target:'_blank', rel:'noopener'}, r[1]))))))));
  const done = D.portfolio.filter((_, i) => state.port[i]).length;
  box.appendChild(h('div', {class:'qcat', style:'margin-top:30px'},
    h('h3', {class:'vh', style:'font-size:1.5rem'}, 'Portfolio and GitHub checklist', h('small', null, done + ' of ' + D.portfolio.length)),
    h('ul', {class:'checks'}, D.portfolio.map((p, i) => h('li', {class: state.port[i] ? 'ok' : ''},
      h('input', {type:'checkbox', checked: !!state.port[i], 'aria-label':p, onchange:(e) => { state.port[i] = e.target.checked; save(); renderResources(); }}),
      h('span', {class:'txt'}, p))))));
  const ta = h('textarea', {readonly:true, 'aria-label':'Progress backup text'});
  const restore = h('textarea', {placeholder:'Paste a backup here to restore it', 'aria-label':'Paste backup to restore'});
  box.appendChild(h('div', {class:'backup qcat', style:'margin-top:30px'},
    h('h3', {class:'vh', style:'font-size:1.5rem'}, 'Back up your progress'),
    h('p', {class:'prose'}, 'Copy this text somewhere safe to keep a backup, or paste a backup below to restore it.'),
    h('button', {type:'button', onclick:() => { ta.value = JSON.stringify(state); ta.select(); }}, 'Show backup text'), ta,
    restore,
    h('button', {type:'button', onclick:() => {
      try { const o = JSON.parse(restore.value); if (!o || typeof o.days !== 'object') throw 0; state = Object.assign(blank(), o); save(); renderAll(); restore.value = ''; restore.placeholder = 'Restored.'; }
      catch(e){ restore.value = ''; restore.placeholder = 'That text is not a valid backup. Paste the full text from "Show backup text".'; }
    }}, 'Restore from backup')));
}

function renderAll(){
  renderSummary(); renderStrip(); renderToday(); renderChips(); renderList();
  if (selected) renderDetail(selected);
  renderOverview(); renderProjects(); renderQuestions(); renderScore(); renderResources();
}

/* ---------- init ---------- */
const phsel = $('#phsel');
phsel.appendChild(h('option', {value:'all'}, 'All phases'));
for (const p of PH) phsel.appendChild(h('option', {value:String(p.id)}, 'Phase ' + p.id + ': ' + p.name));
phsel.addEventListener('change', () => { fPhase = phsel.value; renderList(); });
$('#q').addEventListener('input', (e) => { fq = e.target.value.trim().toLowerCase(); renderList(); });

const m = /^#day-(\d+)$/.exec(location.hash);
selected = m ? Math.min(75, Math.max(1, +m[1])) : nextDay().n;
renderAll();
renderDetail(selected);
initRemote();
})();
</script>
</body>
