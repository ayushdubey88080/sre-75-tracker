 5xx, error rate %, malformed line count.", "Add --json output and --since filtering by timestamp (datetime.strptime).", "Write 3 pytest tests for the parsing function, including a malformed line.", "Week 3 assessment, 60 minutes: Python collection complexities; explain try/except/finally; write a function returning the top 3 IPs from a list of log lines in 10 minutes; plus 5 networking questions (TCP states, DNS TTL, 502 vs 504, MTU, SNAT). Score out of 10 and mark weak days."], "ver": "python3 logparse.py access.log --top 3\npython3 logparse.py missing.log; echo $?      # 2\npytest -q                                     # 3 passed", "inc": "A log parser crashed at 2 AM on a line with a non-UTF-8 byte and the cron job silently stopped producing reports. Fix: open with errors='replace', count malformed lines and log them, exit non-zero on fatal errors, and alert when the report is missing.", "dsa": ["Kth Largest Element in an Array (LeetCode 215): min-heap of size k"], "iq": ["Why use with when opening files?", "Why is a bare except: dangerous?", "How do you configure logging levels and formats?", "How do you process a 50 GB log file in Python without running out of memory?", "How would you design a log-parsing tool so it's safe to run unattended?"], "rev": ["with statement", "Specific exceptions", "Generators for big files"], "done": "logparse.py with tests passing; Week 3 score logged.", "res": [{"t": "Python Logging HOWTO", "u": "https://docs.python.org/3/howto/logging.html"}, {"t": "argparse tutorial", "u": "https://docs.python.org/3/howto/argparse.html"}]}, {"n": 22, "ph": 3, "topic": "Python for APIs, JSON, subprocess and retries", "time": "45 / 85 / 50", "obj": ["Call HTTP APIs and handle JSON", "Run shell commands safely with subprocess", "Implement retries with exponential backoff and jitter"], "con": ["requests (or urllib) calls APIs; always set a timeout, or a call can hang forever.", "JSON maps to dicts and lists: json.loads, json.dumps.", "subprocess.run([...], capture_output=True, text=True, check=True, timeout=30). Pass a list, not shell=True, to avoid injection.", "Retry only transient errors (timeouts, 502, 503, 429), and only idempotent operations.", "Exponential backoff with jitter: wait base * 2^attempt plus randomness, capped. Prevents synchronized retry storms.", "Merge intervals (DSA): sort by start, then merge overlaps, O(n log n)."], "cmd": "import random, time, requests\ndef get_with_retry(url, attempts=5, base=0.5, cap=8):\n    for i in range(attempts):\n        try:\n            r = requests.get(url, timeout=(2, 5))\n            if r.status_code in (429, 502, 503, 504):\n                raise requests.HTTPError(f\"retryable {r.status_code}\")\n            return r\n        except (requests.ConnectionError, requests.Timeout, requests.HTTPError):\n            if i == attempts - 1:\n                raise\n            time.sleep(random.uniform(0, min(cap, base * 2 ** i)))   # full jitter\nimport subprocess\nout = subprocess.run([\"systemctl\", \"is-active\", \"nginx\"], capture_output=True, text=True)\nprint(out.returncode, out.stdout.strip())", "lab": ["pip install requests. Write endpoint_check.py reading endpoints from a YAML or JSON file, checking each with get_with_retry, and printing status and latency.", "Test retries against https://httpbin.org/status/503 and log each attempt with its delay.", "Add a service check using subprocess for systemctl is-active.", "Output results as JSON and exit 1 if any check fails.", "Merge Project 1's Bash and Python checks: the Python tool calls the Bash disk check via subprocess."], "ver": "python3 endpoint_check.py checks.json; echo $?", "inc": "A dependency had a 30-second outage. Every client retried immediately in a tight loop, tripling the load, and the dependency took 20 minutes to recover. Fix: exponential backoff with jitter, a retry budget, and circuit breaking.", "dsa": ["Merge Intervals (LeetCode 56)"], "iq": ["Why must every network call have a timeout?", "Why is shell=True risky in subprocess?", "Which errors should be retried and which shouldn't?", "What is jitter and why add it to backoff?", "Design a retry policy for a payment API client."], "rev": ["Timeouts everywhere", "Backoff with jitter formula", "Idempotency and retries"], "done": "endpoint_check.py retries with jitter and returns correct exit codes.", "res": [{"t": "AWS Builders' Library: Timeouts, retries and backoff with jitter", "u": "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"}, {"t": "Python subprocess", "u": "https://docs.python.org/3/library/subprocess.html"}]}, {"n": 23, "ph": 3, "topic": "Python concurrency and testing", "time": "55 / 75 / 50", "obj": ["Compare threads, asyncio and multiprocessing", "Explain the GIL and when it matters", "Write tests with pytest and mocks"], "con": ["Threads share memory; good for I/O-bound work (network calls). The GIL lets only one thread run Python bytecode at a time, so threads don't speed up CPU-bound Python.", "multiprocessing uses separate processes: good for CPU-bound work, more memory.", "asyncio: one thread, many tasks waiting on I/O cooperatively; great for thousands of concurrent connections.", "concurrent.futures.ThreadPoolExecutor is the simplest way to parallelise I/O tasks.", "pytest: simple assert-based tests; unittest.mock patches network calls so tests are fast and deterministic.", "Meeting Rooms II (DSA): min-heap of end times gives the number of rooms needed."], "cmd": "from concurrent.futures import ThreadPoolExecutor, as_completed\nimport time, requests\nurls = [\"https://example.com\"] * 20\ndef check(u):\n    t = time.perf_counter(); r = requests.get(u, timeout=5)\n    return u, r.status_code, round(time.perf_counter() - t, 3)\nwith ThreadPoolExecutor(max_workers=10) as ex:\n    for f in as_completed(ex.submit(check, u) for u in urls):\n        print(f.result())", "lab": ["Run 20 URL checks sequentially and with a 10-thread pool; record total time for each.", "Rewrite with asyncio and aiohttp (pip install aiohttp); compare.", "Run a CPU-bound function (sum of squares to 10 million) with 4 threads vs 4 processes; record times and explain using the GIL.", "Write pytest tests for endpoint_check.py using unittest.mock to fake 503 then 200 responses.", "Add a GitHub Actions workflow later (Day 31) that runs these tests; for now run them locally."], "ver": "pytest -q        # all pass, no real network calls made", "inc": "A monitoring script checking 2,000 endpoints sequentially took 25 minutes, so results were always stale. A 50-worker thread pool cut it to 40 seconds. Then it overloaded a small internal service. Lesson: bounded concurrency plus per-host limits.", "dsa": ["Meeting Rooms II (LeetCode 253, premium; free on LintCode 919): heap of end times"], "iq": ["Thread vs process?", "What is the GIL and when does it matter?", "When would you use asyncio?", "How do you test code that calls external APIs?", "Design a checker that probes 100,000 URLs every minute without overwhelming targets."], "rev": ["GIL", "ThreadPoolExecutor", "Mocking"], "done": "Measured sequential vs threaded vs async timings; mocked tests passing.", "res": [{"t": "Python concurrent.futures", "u": "https://docs.python.org/3/library/concurrent.futures.html"}, {"t": "pytest docs", "u": "https://docs.pytest.org/"}]}, {"n": 24, "ph": 3, "topic": "Trees and recursion", "time": "50 / 30 / 100", "obj": ["Traverse binary trees with DFS and BFS", "Explain recursion, the call stack and base cases", "Solve 3 tree problems with stated complexity"], "con": ["Tree: nodes with children and no cycles. Binary tree: at most two children. BST: left < node < right, giving O(log n) search when balanced.", "DFS orders: preorder (node, left, right), inorder (left, node, right; sorted for BSTs), postorder.", "BFS uses a queue and visits level by level.", "Recursion needs a base case; depth costs stack space (O(h)).", "Real-world trees: filesystems, DNS hierarchy, JSON documents, Kubernetes ownerReferences."], "cmd": "from collections import deque\ndef max_depth(root):\n    if not root: return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))\ndef level_order(root):\n    if not root: return []\n    q, out = deque([root]), []\n    while q:\n        level = []\n        for _ in range(len(q)):\n            n = q.popleft(); level.append(n.val)\n            if n.left: q.append(n.left)\n            if n.right: q.append(n.right)\n        out.append(level)\n    return out", "lab": ["Implement a TreeNode class and a helper building a tree from a list.", "Solve Maximum Depth (recursive and BFS), Level Order Traversal and Validate BST.", "Time each attempt: target 20 minutes per problem. Write complexity for each.", "Apply it: write a Python function that walks a directory with os.scandir recursively and returns the 10 largest directories."], "ver": "pytest dsa/test_trees.py -q", "inc": "Practical link: a cleanup job recursing through a deeply nested directory hit Python's recursion limit. Rewriting with an explicit stack (iterative DFS) fixed it.", "dsa": ["Maximum Depth of Binary Tree (LeetCode 104)", "Binary Tree Level Order Traversal (LeetCode 102)", "Validate Binary Search Tree (LeetCode 98)"], "iq": ["What is the difference between DFS and BFS?", "Inorder traversal of a BST gives what?", "Space complexity of recursive DFS on a skewed tree?", "Why does 'validate BST' fail if you only compare each node with its children?", "Convert a recursive DFS to iterative. When would you need to?"], "rev": ["Three DFS orders", "BFS with queue", "Recursion depth"], "done": "Three tree problems solved within 20 minutes each; directory-size walker working.", "res": [{"t": "NeetCode roadmap: Trees", "u": "https://neetcode.io/roadmap"}, {"t": "Tech Interview Handbook: Tree", "u": "https://www.techinterviewhandbook.org/algorithms/tree/"}]}, {"n": 25, "ph": 3, "topic": "Graphs and dependency ordering", "time": "50 / 30 / 100", "obj": ["Represent graphs with adjacency lists", "Use BFS/DFS to explore graphs", "Apply topological sort to dependency problems"], "con": ["Graph: nodes and edges, directed or undirected. Adjacency list: dict of node to neighbours.", "BFS finds shortest paths in unweighted graphs; DFS explores deeply and detects cycles.", "Visited sets prevent infinite loops.", "Topological sort (Kahn's algorithm): repeatedly take nodes with no incoming edges. If not all nodes are output, there is a cycle.", "Ops examples: service startup order, Terraform's resource graph, network reachability, microservice call graphs."], "cmd": "from collections import deque, defaultdict\ndef topo(n, deps):            # deps: list of (a, b) meaning b must come before a\n    g, indeg = defaultdict(list), [0]*n\n    for a, b in deps:\n        g[b].append(a); indeg[a] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0); order = []\n    while q:\n        x = q.popleft(); order.append(x)\n        for y in g[x]:\n            indeg[y] -= 1\n            if indeg[y] == 0: q.append(y)\n    return order if len(order) == n else None    # None means cycle", "lab": ["Solve Number of Islands with BFS and with DFS.", "Solve Course Schedule (cycle detection).", "Write startup_order.py: read services.yaml with each service's dependencies (db, cache, api, worker, web) and print a valid start order, or report the cycle.", "Add a cycle to the YAML and confirm detection."], "ver": "python3 startup_order.py services.yaml     # db cache api worker web (one valid order)", "inc": "A platform team's deploy tool started services in parallel and the API crashed because the database migration job hadn't finished. Modelling dependencies as a graph with topological ordering fixed rollout ordering.", "dsa": ["Number of Islands (LeetCode 200)", "Course Schedule (LeetCode 207)"], "iq": ["Adjacency list vs matrix: trade-offs?", "When do you use BFS over DFS?", "How do you detect a cycle in a directed graph?", "Explain topological sort with a real-world example.", "How would you find which services are affected if one service fails, given a dependency graph?"], "rev": ["Kahn's algorithm", "Visited set", "Graph uses in infrastructure"], "done": "Both problems solved; startup_order.py detects cycles.", "res": [{"t": "Tech Interview Handbook: Graph", "u": "https://www.techinterviewhandbook.org/algorithms/graph/"}, {"t": "Python collections", "u": "https://docs.python.org/3/library/collections.html"}]}, {"n": 26, "ph": 3, "topic": "Dynamic programming basics and Project 1 completion", "time": "40 / 80 / 60", "obj": ["Recognise overlapping subproblems and use memoisation", "Solve 3 classic DP problems", "Finish and document Project 1"], "con": ["Dynamic programming: solve a problem by combining answers to smaller subproblems, storing each answer once.", "Top-down (recursion plus functools.cache) vs bottom-up (fill a table).", "Climbing Stairs: ways(n) = ways(n-1) + ways(n-2).", "Coin Change: min coins for amount a = 1 + min over coins of dp[a - coin].", "For SRE interviews, DP is less common than arrays, hash maps, strings and graphs; know the basics, don't over-invest."], "cmd": "from functools import cache\n@cache\ndef ways(n):\n    return 1 if n <= 1 else ways(n-1) + ways(n-2)\ndef coin_change(coins, amount):\n    dp = [0] + [float(\"inf\")] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a: dp[a] = min(dp[a], dp[a-c] + 1)\n    return -1 if dp[amount] == float(\"inf\") else dp[amount]", "lab": ["Solve Climbing Stairs, House Robber and Coin Change; write both recursive-memo and table versions for one.", "Project 1: combine health.sh, logparse.py, endpoint_check.py and cert_expiry.py under one CLI (opsctl with subcommands via argparse).", "Add a Makefile or README commands, sample outputs, and a 'design decisions' section.", "Add a failure-scenario section: what each check catches, and one false positive you saw.", "Tag the repo p1-v1.0."], "ver": "python3 opsctl.py --help        # lists subcommands health, logs, endpoints, certs\ngit tag | grep p1-v1.0", "inc": "Project 1 reality check: the cert check alerted on an internal host every night because it used a private CA. You added a --cafile option and documented it, reducing alert noise. Write this up as a 3-line story for interviews.", "dsa": ["Climbing Stairs (LeetCode 70)", "House Robber (LeetCode 198)", "Coin Change (LeetCode 322)"], "iq": ["What two properties make a problem suitable for DP?", "Memoisation vs tabulation?", "Time and space complexity of your Coin Change solution?", "How would you reduce House Robber to O(1) space?", "Describe a tool you built to reduce toil. What did it measure, and how did you know it worked?"], "rev": ["DP recurrence for each problem", "Project 1 story", "When greedy fails (coin change)"], "done": "Three DP problems solved; Project 1 tagged with a complete README.", "res": [{"t": "Tech Interview Handbook: Dynamic Programming", "u": "https://www.techinterviewhandbook.org/algorithms/dynamic-programming/"}, {"t": "functools.cache", "u": "https://docs.python.org/3/library/functools.html"}]}, {"n": 27, "ph": 3, "topic": "Recovery day: timed DSA and Linux/Python revision", "time": "30 / 60 / 90", "obj": ["Measure coding speed under time pressure", "Close gaps from Days 1 to 26", "Practise explaining code aloud"], "con": ["Interview coding loop: clarify, give examples, state a brute force, optimise, code, test with edge cases, state complexity.", "Edge cases to always test: empty input, single item, duplicates, negatives, very large input.", "Spaced repetition: revisit material after 1, 3 and 7 days to move it into long-term memory.", "Common SRE coding tasks: parse logs, aggregate counts, rate limit, find top-K, process intervals, validate configs."], "cmd": "# Timed session: 2 problems, 25 minutes each, talk aloud\n# 1) Given log lines \"ts ip path status\", return top 3 paths by 5xx count\n# 2) Given intervals of maintenance windows, return total covered minutes", "lab": ["Set a 25-minute timer and solve problem 1 aloud, recording yourself. Then problem 2.", "Review the recording: did you clarify, test edge cases, and state complexity?", "Redo two DSA problems from earlier days that you found hard, without looking.", "Pick every day marked 'Needs revision' in the tracker and redo its lab's key step.", "Update tracker notes with what still feels weak."], "ver": "# Both timed problems pass your own edge-case tests within 25 minutes each", "inc": "Mock troubleshooting (answer hidden until you write yours): 'A cron-run Python script works in your shell but fails at night with ModuleNotFoundError.' Expected: cron uses system Python, not your venv; call .venv/bin/python explicitly.", "dsa": ["Timed: Top paths by 5xx (custom)", "Timed: Total covered minutes from intervals (variation of LeetCode 56)"], "iq": ["Walk me through how you approach a coding problem you haven't seen.", "What edge cases did you test and why?", "How would you change your solution if the log were 100 GB?", "How would you test your log parser?", "Write a function to detect if a server's error rate exceeds 5% in any rolling 1-minute window."], "rev": ["Coding interview loop", "Edge case list", "Weak topics list"], "done": "Both timed problems solved in time; all 'Needs revision' labs from Days 1 to 26 revisited.", "res": [{"t": "Tech Interview Handbook: Coding interview cheatsheet", "u": "https://www.techinterviewhandbook.org/coding-interview-cheatsheet/"}, {"t": "NeetCode 150 list", "u": "https://neetcode.io/practice"}]}, {"n": 28, "ph": 4, "topic": "Git internals and team workflows (Week 4 assessment)", "time": "50 / 70 / 60", "obj": ["Explain commits, branches and the staging area", "Use rebase, revert, reset and bisect safely", "Complete the Week 4 assessment"], "con": ["A commit is a snapshot plus a pointer to its parent. A branch is a movable pointer to a commit. HEAD points to what you have checked out.", "merge keeps history with a merge commit; rebase rewrites your commits onto a new base. Never rebase shared branches.", "revert creates a new commit undoing a change (safe on shared branches). reset moves the branch pointer (local use only).", "git bisect binary-searches history to find the commit that introduced a bug.", "Trunk-based development with short-lived branches and pull requests is common in high-velocity teams.", "LRU cache (DSA): dict plus doubly linked list, or OrderedDict, for O(1) get and put."], "cmd": "git log --oneline --graph --all | head -20\ngit switch -c feature/x\ngit rebase -i main\ngit revert <sha>\ngit reset --soft HEAD~1\ngit bisect start; git bisect bad; git bisect good <sha>; git bisect run ./test.sh\ngit reflog", "lab": ["Create a repo with 20 commits where commit 13 introduces a bug that test.sh detects. Find it with git bisect run.", "Create a merge conflict between two branches and resolve it.", "Practise revert vs reset on a throwaway branch; use reflog to recover a 'lost' commit.", "Week 4 assessment, 60 minutes: one timed medium problem (25 min), Python concurrency question, 3 Linux questions, 3 networking questions. Score out of 10 and mark weak days."], "ver": "git bisect run ./test.sh      # identifies the first bad commit", "inc": "A bad config change reached production and the on-call engineer ran git reset --hard and force-pushed main, deleting two colleagues' commits. Lesson: protect main, use git revert for production rollbacks, and recover lost work via reflog.", "dsa": ["LRU Cache (LeetCode 146)"], "iq": ["What is a commit object?", "Merge vs rebase?", "Revert vs reset: which is safe on a shared branch?", "How does git bisect work?", "Design a branching and release strategy for a team deploying 20 times a day."], "rev": ["revert vs reset", "bisect", "Trunk-based development"], "done": "Bug commit found with bisect; lost commit recovered with reflog; Week 4 score logged.", "res": [{"t": "Pro Git book", "u": "https://git-scm.com/book/en/v2"}, {"t": "git bisect docs", "u": "https://git-scm.com/docs/git-bisect"}]}, {"n": 29, "ph": 4, "topic": "Docker fundamentals: images, layers, namespaces", "time": "60 / 75 / 45", "obj": ["Explain what a container is at the kernel level", "Write efficient multi-stage Dockerfiles", "Understand image layers and caching"], "con": ["A container is a process isolated with namespaces (pid, net, mnt, uts, ipc, user) and limited with cgroups. It is not a VM; it shares the host kernel.", "Image: read-only layers; each Dockerfile instruction creates a layer. Order instructions from least to most frequently changing to use the cache.", "Multi-stage builds compile in one stage and copy only the result into a small runtime image.", "Run as a non-root USER; pin base image versions; use .dockerignore.", "ENTRYPOINT vs CMD; exec form ['app'] makes your app PID 1 so it receives SIGTERM.", "Queue from stacks (DSA): two stacks give amortised O(1) queue operations."], "cmd": "FROM python:3.12-slim AS build\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir --prefix=/install -r requirements.txt\nFROM python:3.12-slim\nRUN useradd -r -u 10001 app\nCOPY --from=build /install /usr/local\nCOPY app.py /app/app.py\nUSER app\nEXPOSE 8080\nCMD [\"python\", \"/app/app.py\"]\n\ndocker build -t status-api:0.1 . ; docker history status-api:0.1\ndocker run -d --name api -p 8080:8080 --memory 128m --cpus 0.5 status-api:0.1\ndocker inspect api --format '{{.State.Pid}}'; sudo ls -l /proc/<pid>/ns", "lab": ["Write status-api: a Flask or FastAPI app with /, /healthz, /slow?ms=, /error?rate= and a /metrics endpoint placeholder. This app is reused in Projects 2 to 4.", "Build it single-stage, then multi-stage; compare sizes with docker images.", "Run it with memory and CPU limits; inspect its namespaces from the host via /proc/<pid>/ns.", "Change app.py only and rebuild; confirm dependency layers come from cache.", "Run docker stop and confirm the app logs a graceful SIGTERM shutdown (exec-form CMD)."], "ver": "curl localhost:8080/healthz      # {\"status\":\"ok\"}\ndocker images status-api          # multi-stage image smaller", "inc": "A container takes exactly 10 seconds to stop on every deploy. The shell-form CMD runs the app under /bin/sh, which doesn't forward SIGTERM, so Docker waits for the timeout then SIGKILLs. Fix: exec-form CMD or a tiny init (tini).", "dsa": ["Implement Queue using Stacks (LeetCode 232)"], "iq": ["What is the difference between a container and a VM?", "What are namespaces and cgroups?", "How do Docker layers and the build cache work?", "Why run containers as non-root?", "A container ignores SIGTERM and always takes the full grace period to stop. Why, and how do you fix it?"], "rev": ["Namespaces list", "Layer caching order", "Exec vs shell form"], "done": "status-api image built multi-stage, runs non-root, stops gracefully.", "res": [{"t": "Docker: Get started", "u": "https://docs.docker.com/get-started/"}, {"t": "Dockerfile best practices", "u": "https://docs.docker.com/build/building/best-practices/"}]}, {"n": 30, "ph": 4, "topic": "Docker networking, volumes, Compose and debugging", "time": "50 / 85 / 45", "obj": ["Use bridge networks, port publishing and container DNS", "Persist data with volumes", "Debug failing containers systematically"], "con": ["Bridge network: containers on a user-defined network resolve each other by name via Docker's embedded DNS.", "-p 8080:80 publishes a host port to a container port (DNAT under the hood).", "Volumes persist data outside the container's writable layer; bind mounts map host paths.", "Compose defines multi-container apps in YAML; depends_on with healthcheck conditions controls start order.", "Debugging: docker logs, docker inspect (State.ExitCode, OOMKilled), docker exec, docker events, docker stats.", "Rate limiter (DSA-style): sliding window counter with a deque of timestamps."], "cmd": "services:\n  api:\n    build: .\n    ports: [\"8080:8080\"]\n    environment: [REDIS_HOST=redis]\n    depends_on:\n      redis: {condition: service_healthy}\n  redis:\n    image: redis:7-alpine\n    volumes: [redisdata:/data]\n    healthcheck: {test: [\"CMD\", \"redis-cli\", \"ping\"], interval: 5s, retries: 5}\nvolumes:\n  redisdata: {}\n\ndocker compose up -d; docker compose ps; docker compose logs -f api\ndocker inspect api --format '{{.State.ExitCode}} {{.State.OOMKilled}}'\ndocker stats --no-stream", "lab": ["Add a Redis hit counter to status-api and run both with Compose.", "Restart the stack; confirm the counter persists via the volume.", "Break things on purpose and diagnose each: wrong REDIS_HOST, a memory limit of 20m causing OOM, a port already in use, and a missing environment variable.", "Write a rate limiter class allowing N requests per window per client, and add it to /api with HTTP 429 responses.", "Project 2 kickoff: README with architecture diagram (text) and goals."], "ver": "for i in $(seq 1 15); do curl -s -o /dev/null -w '%{http_code} ' localhost:8080/api; done   # 200s then 429s", "inc": "A Compose-based staging stack fails after a laptop reboot: the API starts before Postgres accepts connections and exits. Fix: health-check-based depends_on plus retry-on-startup in the app. Lesson carries to Kubernetes: apps must tolerate dependencies being unavailable.", "dsa": ["Design: sliding-window rate limiter (custom, similar to LeetCode 362 Design Hit Counter)"], "iq": ["How do containers on the same Docker network find each other?", "Volume vs bind mount?", "How do you tell whether a container was OOM-killed?", "Why isn't depends_on enough to guarantee a dependency is ready?", "A container works locally but fails in CI with 'connection refused' to its database. How do you debug it?"], "rev": ["Docker DNS", "inspect fields", "Rate limiter design"], "done": "Compose stack with persistent Redis; four failures diagnosed; 429 rate limiting works.", "res": [{"t": "Docker networking overview", "u": "https://docs.docker.com/engine/network/"}, {"t": "Compose file reference", "u": "https://docs.docker.com/reference/compose-file/"}]}, {"n": 31, "ph": 4, "topic": "CI/CD pipelines and deployment strategies", "time": "50 / 90 / 40", "obj": ["Build a GitHub Actions pipeline that lints, tests, builds and pushes an image", "Compare rolling, blue/green and canary deployments", "Explain how pipelines reduce risk"], "con": ["CI (continuous integration): every change is built and tested automatically. CD (continuous delivery/deployment): every passing change can be, or is, released automatically.", "Pipeline stages: lint, unit test, build, scan, push artifact, deploy to staging, smoke test, promote.", "Rolling: replace instances gradually. Blue/green: two full environments, switch traffic at once, instant rollback. Canary: send a small % of traffic to the new version and watch SLIs before expanding.", "Immutable artifacts: build once, tag with the git SHA, promote the same image through environments.", "Secrets in CI: use the platform's secret store or OIDC federation, never hard-coded keys."], "cmd": "name: ci\non: [push, pull_request]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    permissions: {contents: read, packages: write}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with: {python-version: \"3.12\"}\n      - run: pip install -r requirements.txt ruff pytest && ruff check . && pytest -q\n      - uses: docker/login-action@v3\n        with: {registry: ghcr.io, username: \"${{ github.actor }}\", password: \"${{ secrets.GITHUB_TOKEN }}\"}\n      - uses: docker/build-push-action@v6\n        with: {push: \"${{ github.ref == 'refs/heads/main' }}\", tags: \"ghcr.io/${{ github.repository }}/status-api:${{ github.sha }}\"}", "lab": ["Add .github/workflows/ci.yml to the Project 2 repo using the workflow above.", "Add unit tests for status-api endpoints; make the pipeline fail on a deliberate lint error, then fix it.", "Push to main and confirm the image appears in GitHub Container Registry tagged with the SHA.", "Add a Trivy scan step (aquasecurity/trivy-action) that fails on CRITICAL vulnerabilities.", "Write a 1-page comparison of rolling, blue/green and canary for status-api, including rollback time and cost."], "ver": "docker pull ghcr.io/<you>/<repo>/status-api:<sha>", "inc": "A release passed all tests but doubled p99 latency in production; it was rolled out to 100% at once and took 40 minutes to roll back. With a canary at 5% and an automated latency check, it would have been caught in minutes with 5% user impact.", "dsa": ["Valid Sudoku (LeetCode 36): sets per row, column, box"], "iq": ["CI vs continuous delivery vs continuous deployment?", "Why tag images with the git SHA instead of 'latest'?", "Rolling vs blue/green vs canary: trade-offs?", "How should a pipeline handle secrets?", "Design a deployment pipeline that lets 50 engineers deploy safely many times a day."], "rev": ["Pipeline stages", "Deployment strategies", "Immutable artifacts"], "done": "Green pipeline pushing SHA-tagged images, with a vulnerability scan gate.", "res": [{"t": "GitHub Actions docs", "u": "https://docs.github.com/en/actions"}, {"t": "Google Cloud: Application deployment and testing strategies", "u": "https://cloud.google.com/architecture/application-deployment-and-testing-strategies"}]}, {"n": 32, "ph": 4, "topic": "Kubernetes architecture", "time": "70 / 70 / 40", "obj": ["Explain every control plane and node component", "Describe the reconciliation loop", "Create a local cluster with kind"], "con": ["API server: the front door; everything reads and writes state through it. etcd: the key-value store holding cluster state.", "Scheduler: assigns pods to nodes. Controller manager: runs controllers that reconcile desired vs actual state.", "kubelet: the node agent that runs pods via the container runtime (containerd). kube-proxy: programs Service routing (iptables/IPVS).", "Declarative model: you declare desired state; controllers continuously work to make reality match. This is why manual edits to managed objects get reverted.", "Pod: the smallest deployable unit; one or more containers sharing network and volumes.", "BFS on grids (DSA): multi-source BFS spreads from several starting points at once."], "cmd": "# kind: https://kind.sigs.k8s.io/\ncat > kind.yaml <<'EOF'\nkind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnodes: [{role: control-plane}, {role: worker}, {role: worker}]\nEOF\nkind create cluster --name sre --config kind.yaml\nkubectl get nodes -o wide\nkubectl get pods -n kube-system\nkubectl api-resources | head\nkubectl get --raw='/readyz?verbose'", "lab": ["Install kind and kubectl; create the 3-node cluster.", "List kube-system pods and map each to its component.", "Run kubectl run nginx --image=nginx; watch events with kubectl get events -w to see scheduling, pulling and starting.", "Delete the pod created by a Deployment and watch it come back; explain which controller did it.", "Draw the flow of kubectl apply: API server, etcd, scheduler, kubelet, runtime."], "ver": "kubectl get nodes        # 3 Ready", "inc": "In a managed cluster, kubectl commands time out intermittently and several operators restart with 'leader election lost'. The API server was under heavy load from a misbehaving controller listing all pods every second. Mitigation: find the client via API server audit logs/metrics and fix it; tune operator lease durations.", "dsa": ["Rotting Oranges (LeetCode 994): multi-source BFS"], "iq": ["What are the control plane components?", "What happens when you run kubectl apply -f deployment.yaml?", "What is etcd and why is it critical?", "What does the kubelet do?", "Explain the reconciliation loop. Why do manual edits to operator-managed resources get reverted?"], "rev": ["Component responsibilities", "apply flow", "Reconciliation"], "done": "kind cluster running; apply flow diagram and component map committed.", "res": [{"t": "Kubernetes: Cluster components", "u": "https://kubernetes.io/docs/concepts/overview/components/"}, {"t": "kind quick start", "u": "https://kind.sigs.k8s.io/docs/user/quick-start/"}]}, {"n": 33, "ph": 4, "topic": "Pods, Deployments and Services", "time": "55 / 85 / 40", "obj": ["Deploy status-api with a Deployment and Service", "Perform and roll back a rolling update", "Explain Service types and label selectors"], "con": ["Deployment manages ReplicaSets, which manage pods. Changing the pod template creates a new ReplicaSet and rolls pods over.", "Rolling update settings: maxSurge (extra pods allowed) and maxUnavailable (pods allowed down).", "Service gives a stable virtual IP and DNS name for a set of pods selected by labels. Types: ClusterIP (internal), NodePort, LoadBalancer, plus headless (clusterIP: None).", "Endpoints/EndpointSlices list the pod IPs behind a Service; if they're empty, the selector doesn't match or pods aren't ready.", "kubectl rollout undo returns to the previous ReplicaSet."], "cmd": "kind load docker-image status-api:0.1 --name sre\nkubectl create deployment api --image=status-api:0.1 --replicas=3 --dry-run=client -o yaml > deploy.yaml\nkubectl apply -f deploy.yaml\nkubectl expose deployment api --port 80 --target-port 8080\nkubectl get endpointslices -l kubernetes.io/service-name=api\nkubectl set image deployment/api status-api=status-api:0.2\nkubectl rollout status deployment/api; kubectl rollout history deployment/api\nkubectl rollout undo deployment/api\nkubectl run tmp --rm -it --image=busybox -- wget -qO- http://api", "lab": ["Load status-api into kind; deploy 3 replicas with a Service.", "Curl the Service from a busybox pod and see responses from different pods.", "Build status-api:0.2 with a visible version change; roll out and watch kubectl get rs.", "Deploy a broken image tag; watch the rollout stall, then undo.", "Break the Service selector and observe empty endpoints; fix it."], "ver": "kubectl get endpointslices -l kubernetes.io/service-name=api    # 3 addresses\nkubectl rollout history deployment/api                          # multiple revisions", "inc": "After a refactor of labels in the Deployment, all traffic to the API fails with connection refused, though pods are Running. The Service selector still uses the old label, so EndpointSlices are empty. Always check endpoints when a Service 'doesn't work'.", "dsa": ["Clone Graph (LeetCode 133)"], "iq": ["Pod vs ReplicaSet vs Deployment?", "What do maxSurge and maxUnavailable control?", "ClusterIP vs NodePort vs LoadBalancer?", "Pods are running but the Service returns nothing. What do you check first?", "How would you roll back a bad deployment, and what doesn't a rollback undo (e.g. database migrations)?"], "rev": ["Object hierarchy", "Rolling update knobs", "Endpoints check"], "done": "Rolling update and rollback done; empty-endpoints failure reproduced and fixed.", "res": [{"t": "Kubernetes: Deployments", "u": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"}, {"t": "Kubernetes: Service", "u": "https://kubernetes.io/docs/concepts/services-networking/service/"}]}, {"n": 34, "ph": 4, "topic": "ConfigMaps, Secrets, probes, requests and limits", "time": "60 / 80 / 40", "obj": ["Configure apps with ConfigMaps and Secrets", "Set liveness, readiness and startup probes correctly", "Explain requests, limits and QoS classes"], "con": ["ConfigMap: non-secret config as env vars or files. Secret: base64-encoded (not encrypted by default) sensitive data; enable encryption at rest and restrict RBAC.", "Readiness probe: is the pod ready for traffic? Failing removes it from Service endpoints. Liveness probe: is it stuck? Failing restarts the container. Startup probe: protects slow starters from liveness kills.", "A liveness probe should not depend on downstream services, or a dependency blip restarts everything.", "Requests: what the scheduler reserves. Limits: the hard cap. CPU over limit is throttled; memory over limit is OOM-killed (exit 137).", "QoS: Guaranteed (requests = limits for all), Burstable (some requests), BestEffort (none, first evicted)."], "cmd": "containers:\n- name: status-api\n  image: status-api:0.2\n  envFrom: [{configMapRef: {name: api-config}}]\n  resources:\n    requests: {cpu: 100m, memory: 128Mi}\n    limits: {memory: 256Mi}\n  startupProbe: {httpGet: {path: /healthz, port: 8080}, failureThreshold: 30, periodSeconds: 2}\n  readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}\n  livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10, failureThreshold: 3}\n\nkubectl create configmap api-config --from-literal=LOG_LEVEL=info\nkubectl create secret generic api-secret --from-literal=TOKEN=s3cr3t\nkubectl get pod <pod> -o jsonpath='{.status.qosClass}'", "lab": ["Move status-api settings into a ConfigMap and a token into a Secret; verify with kubectl exec env.", "Add the three probes. Make /healthz fail via an env flag and watch readiness remove the pod from endpoints.", "Set liveness to a path that hangs; watch restarts and read kubectl describe events.", "Set memory limit 64Mi and hit an endpoint that allocates 200 MB; confirm OOMKilled and exit 137 in describe.", "Create one pod of each QoS class and verify with jsonpath."], "ver": "kubectl describe pod <pod> | grep -A3 'Last State'     # Reason: OOMKilled, Exit Code: 137", "inc": "A JVM service OOMKills every few hours with exit 137 and no Java OutOfMemoryError in logs. The heap was set to 90% of the container limit, leaving no room for metaspace, threads and native buffers (including profiling agents). Fix: heap around 70-75% of the limit, measure native memory, keep config in Helm values so it survives redeploys.", "dsa": ["Evaluate Reverse Polish Notation (LeetCode 150): stack"], "iq": ["Readiness vs liveness vs startup probes?", "What happens when a container exceeds its CPU limit? Its memory limit?", "What are the three QoS classes and why do they matter?", "Why are Kubernetes Secrets not secure by default?", "Every pod restarts when the database has a 30-second blip. What's wrong with the probes?"], "rev": ["Probe purposes", "Throttle vs OOM kill", "QoS rules"], "done": "Probe behaviour and OOMKilled reproduced; QoS classes verified.", "res": [{"t": "Kubernetes: Configure probes", "u": "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"}, {"t": "Kubernetes: Resource management", "u": "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"}]}, {"n": 35, "ph": 4, "topic": "Scheduling, autoscaling and disruption (Week 5 assessment)", "time": "50 / 70 / 60", "obj": ["Control placement with affinity, taints and tolerations", "Protect availability with PodDisruptionBudgets and spread constraints", "Autoscale with HPA, and complete the Week 5 assessment"], "con": ["The scheduler filters nodes (enough requested resources, taints, affinity) then scores them.", "Taints repel pods; tolerations allow pods onto tainted nodes. Node affinity attracts pods to nodes; pod anti-affinity and topologySpreadConstraints spread replicas across nodes and zones.", "PodDisruptionBudget limits voluntary disruptions (drains, upgrades), e.g. minAvailable: 2.", "HPA scales replicas on metrics (CPU utilisation relative to requests, or custom metrics). Without requests, CPU-based HPA can't work.", "Pending pods usually mean insufficient resources, unsatisfiable affinity, taints, or an unbound PVC.", "Task Scheduler (DSA): greedy counting of the most frequent task."], "cmd": "kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml\nkubectl patch -n kube-system deploy metrics-server --type=json \\\n  -p '[{\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/args/-\",\"value\":\"--kubelet-insecure-tls\"}]'\nkubectl autoscale deployment api --cpu-percent=60 --min=2 --max=8\nkubectl taint nodes sre-worker2 dedicated=batch:NoSchedule\nkubectl create pdb api-pdb --selector=app=api --min-available=2\nkubectl drain sre-worker --ignore-daemonsets --delete-emptydir-data\nkubectl top pods", "lab": ["Install metrics-server (with the kind TLS flag) and create an HPA for api.", "Generate load (a busybox loop or hey) against /slow and watch the HPA scale out; stop and watch it scale in.", "Taint a node; show pods avoid it; add a toleration and show they can land there.", "Add a PDB with minAvailable 2 and drain a node; observe the drain respecting it.", "Request 64 CPUs in a pod and diagnose the Pending reason from describe.", "Week 5 assessment, 60 minutes: 6 Kubernetes questions (probes, QoS, Service debugging, rollout, HPA, Pending) plus one timed medium problem. Score and mark weak days."], "ver": "kubectl get hpa api -w        # replicas rise under load\nkubectl describe pod big      # FailedScheduling: Insufficient cpu", "inc": "A cluster upgrade drained nodes and took the payments API fully offline for 3 minutes: all replicas were on the same node and there was no PDB. Fix: topology spread across nodes and zones plus a PDB.", "dsa": ["Task Scheduler (LeetCode 621)"], "iq": ["How does the scheduler decide where a pod runs?", "Taints vs node affinity?", "What does a PodDisruptionBudget protect against, and what doesn't it?", "Why might an HPA not scale?", "A pod is Pending for 10 minutes. Walk me through your debugging."], "rev": ["Pending causes", "PDB scope (voluntary only)", "HPA requirements"], "done": "HPA scaled in and out; drain respected the PDB; Week 5 score logged.", "res": [{"t": "Kubernetes: Assigning pods to nodes", "u": "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"}, {"t": "Kubernetes: Horizontal Pod Autoscaling", "u": "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"}]}, {"n": 36, "ph": 4, "topic": "Storage and StatefulSets", "time": "55 / 80 / 45", "obj": ["Use PersistentVolumes, PVCs and StorageClasses", "Explain StatefulSet identity and ordering", "Debug stuck volumes"], "con": ["PersistentVolume (PV): a piece of storage. PersistentVolumeClaim (PVC): a request for storage. StorageClass: provisions PVs dynamically.", "Access modes: ReadWriteOnce (one node), ReadOnlyMany, ReadWriteMany (needs shared storage like NFS/EFS).", "volumeBindingMode WaitForFirstConsumer delays provisioning until a pod is scheduled, so the disk lands in the right zone.", "StatefulSet: stable pod names (db-0, db-1), stable storage per pod via volumeClaimTemplates, ordered start and stop. Needs a headless Service for per-pod DNS.", "Reclaim policy Delete vs Retain decides whether data survives PVC deletion.", "Backtracking (DSA): explore choices, undo, try the next."], "cmd": "kubectl get storageclass\napiVersion: apps/v1\nkind: StatefulSet\nmetadata: {name: redis}\nspec:\n  serviceName: redis\n  replicas: 2\n  selector: {matchLabels: {app: redis}}\n  template:\n    metadata: {labels: {app: redis}}\n    spec:\n      containers:\n      - {name: redis, image: \"redis:7-alpine\", volumeMounts: [{name: data, mountPath: /data}]}\n  volumeClaimTemplates:\n  - metadata: {name: data}\n    spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}\n\nkubectl get pvc; kubectl describe pvc data-redis-0", "lab": ["Create a headless Service and the Redis StatefulSet above.", "Write a key in redis-0, delete the pod, and confirm the data survives when it returns with the same name.", "Resolve redis-0.redis.default.svc.cluster.local from a busybox pod.", "Scale to 0 and back; confirm PVCs persist. Delete a PVC while a pod uses it and observe it stuck in Terminating (finalizer).", "Write notes on how this differs on EKS (EBS CSI driver, zone affinity)."], "ver": "kubectl exec redis-0 -- redis-cli get k     # value survives pod deletion", "inc": "After a node failure on EKS, a StatefulSet pod stays Pending: its EBS volume lives in us-east-1a but the only node with capacity is in 1b. EBS is zonal. Fix: node capacity in every zone, or multi-AZ-aware storage, and test node loss.", "dsa": ["Word Search (LeetCode 79): backtracking"], "iq": ["PV vs PVC vs StorageClass?", "Deployment vs StatefulSet: when do you need a StatefulSet?", "What is a headless Service for?", "What does WaitForFirstConsumer solve?", "A PVC is stuck in Terminating. Why, and how do you resolve it safely?"], "rev": ["Access modes", "StatefulSet guarantees", "Reclaim policies"], "done": "StatefulSet data survives pod deletion; per-pod DNS verified.", "res": [{"t": "Kubernetes: Persistent Volumes", "u": "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"}, {"t": "Kubernetes: StatefulSets", "u": "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"}]}, {"n": 37, "ph": 4, "topic": "Kubernetes networking, Ingress and NetworkPolicy", "time": "60 / 75 / 45", "obj": ["Explain pod-to-pod and pod-to-Service networking", "Route HTTP traffic with an Ingress controller", "Restrict traffic with NetworkPolicy"], "con": ["Every pod gets its own IP; all pods can reach each other without NAT. The CNI plugin (Calico, Cilium, AWS VPC CNI) implements this.", "Service traffic: kube-proxy (or eBPF in Cilium) translates the ClusterIP to a pod IP.", "CoreDNS resolves service.namespace.svc.cluster.local.", "Ingress: L7 routing by host and path into Services, implemented by a controller (ingress-nginx, AWS Load Balancer Controller). Gateway API is the newer successor.", "NetworkPolicy: default allow-all; once a policy selects a pod, only allowed traffic gets in. Requires a CNI that enforces it (kind's default kindnet doesn't; use Calico).", "Dijkstra (DSA): shortest path with non-negative weights using a min-heap."], "cmd": "kind create cluster --name net --config - <<'EOF'\nkind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnetworking: {disableDefaultCNI: true}\nnodes: [{role: control-plane}, {role: worker}]\nEOF\nkubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-allow-web}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  ingress: [{from: [{podSelector: {matchLabels: {app: web}}}], ports: [{port: 8080}]}]", "lab": ["Create the Calico-enabled cluster (or install ingress-nginx on your main cluster for the Ingress steps).", "Deploy api and two client pods labelled app=web and app=other; confirm both can reach api.", "Apply the NetworkPolicy; confirm web succeeds and other times out.", "Install ingress-nginx and route /api to the api Service on a hostname; curl with the Host header.", "Trace a request in notes: client, ingress controller pod, Service, kube-proxy rules, pod."], "ver": "kubectl exec other -- wget -qO- -T 3 http://api    # times out after policy\nkubectl exec web -- wget -qO- -T 3 http://api      # succeeds", "inc": "After a security team applied a default-deny NetworkPolicy, every pod in the namespace started failing DNS lookups. Egress to CoreDNS on UDP and TCP 53 in kube-system wasn't allowed. Always add a DNS egress rule with default-deny.", "dsa": ["Network Delay Time (LeetCode 743): Dijkstra"], "iq": ["How do two pods on different nodes communicate?", "What does kube-proxy do?", "Ingress vs Service of type LoadBalancer?", "What happens to traffic when the first NetworkPolicy selects a pod?", "After applying a deny-all policy, pods can't resolve names. Why?"], "rev": ["CNI role", "Service DNS name format", "NetworkPolicy semantics"], "done": "NetworkPolicy allow/deny demonstrated; Ingress routing working.", "res": [{"t": "Kubernetes: Networking model", "u": "https://kubernetes.io/docs/concepts/services-networking/"}, {"t": "Kubernetes: Network Policies", "u": "https://kubernetes.io/docs/concepts/services-networking/network-policies/"}]}, {"n": 38, "ph": 4, "topic": "RBAC and Kubernetes security basics", "time": "55 / 75 / 50", "obj": ["Grant least privilege with Roles and RoleBindings", "Use ServiceAccounts for workloads", "Apply Pod Security Standards and a secure securityContext"], "con": ["Role/ClusterRole: lists allowed verbs (get, list, watch, create, update, delete) on resources. RoleBinding/ClusterRoleBinding: grants a role to users, groups or ServiceAccounts.", "ServiceAccount: an identity for pods. Each pod gets a projected token; disable automount if not needed.", "kubectl auth can-i tests permissions, including impersonation with --as.", "Pod Security Standards: privileged, baseline, restricted, enforced per namespace with labels.", "securityContext: runAsNonRoot, readOnlyRootFilesystem, allowPrivilegeEscalation: false, drop all capabilities.", "Subsets (DSA): backtracking or bitmask enumeration."], "cmd": "kubectl create sa reader -n dev\nkubectl create role pod-reader -n dev --verb=get,list,watch --resource=pods,pods/log\nkubectl create rolebinding reader-bind -n dev --role=pod-reader --serviceaccount=dev:reader\nkubectl auth can-i list pods -n dev --as=system:serviceaccount:dev:reader       # yes\nkubectl auth can-i delete pods -n dev --as=system:serviceaccount:dev:reader     # no\nkubectl label ns dev pod-security.kubernetes.io/enforce=restricted", "lab": ["Create namespace dev, the reader SA, Role and RoleBinding; test with auth can-i.", "Run a pod using the reader SA that calls the API with its token to list pods (curl inside the pod); then try to delete and get 403.", "Label dev with restricted Pod Security; try deploying a root container and read the rejection.", "Fix status-api's manifest to pass restricted (non-root, no privilege escalation, drop ALL, seccomp RuntimeDefault).", "List all ClusterRoleBindings to cluster-admin and write why each exists."], "ver": "kubectl get pods -n dev     # status-api Running under restricted policy", "inc": "A CI ServiceAccount had cluster-admin 'temporarily'. A leaked CI token allowed someone to read every Secret in the cluster. Fix: namespace-scoped roles, short-lived tokens via OIDC, audit logs, and regular RBAC reviews.", "dsa": ["Subsets (LeetCode 78)"], "iq": ["Role vs ClusterRole?", "How do pods authenticate to the API server?", "How do you check what a ServiceAccount can do?", "What does the restricted Pod Security Standard require?", "Design RBAC for a platform with 30 teams sharing one cluster."], "rev": ["Verbs and resources", "auth can-i --as", "securityContext fields"], "done": "Least-privilege SA verified; status-api passes the restricted policy.", "res": [{"t": "Kubernetes: RBAC", "u": "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"}, {"t": "Kubernetes: Pod Security Standards", "u": "https://kubernetes.io/docs/concepts/security/pod-security-standards/"}]}, {"n": 39, "ph": 4, "topic": "Kubernetes troubleshooting I: CrashLoopBackOff, OOMKilled, ImagePullBackOff, Pending", "time": "35 / 105 / 40", "obj": ["Diagnose the four most common pod failures from evidence", "Use a consistent debugging sequence", "Write runbook entries for each"], "con": ["Debugging sequence: kubectl get (status, restarts), describe (events, last state, exit code), logs and logs --previous, get events sorted by time, then exec or debug.", "CrashLoopBackOff: the container keeps exiting; back-off grows to 5 minutes. Check exit code and previous logs.", "OOMKilled: Reason OOMKilled, exit 137; compare usage to limits.", "ImagePullBackOff/ErrImagePull: wrong name or tag, missing pull secret, registry down or rate-limited.", "Pending: scheduler can't place it; the describe events explain why.", "kubectl debug adds an ephemeral container to a running pod for tools the image lacks."], "cmd": "kubectl get pods -o wide\nkubectl describe pod <pod> | sed -n '/Last State/,/Ready/p;/Events/,$p'\nkubectl logs <pod> --previous\nkubectl get events --sort-by=.lastTimestamp | tail -20\nkubectl get pod <pod> -o go-template='{{range .status.containerStatuses}}{{.name}} {{.restartCount}} {{.lastState.terminated.reason}} {{.lastState.terminated.exitCode}}{{\"\\n\"}}{{end}}'\nkubectl debug -it <pod> --image=busybox --target=<container>", "lab": ["Create a namespace 'broken' with 6 deliberately broken Deployments (write them yourself, then wait a day before diagnosing, or swap with a friend): bad command (exit 1), missing env var, memory limit too low, wrong image tag, private image without pull secret, 32-CPU request.", "Diagnose each using only the debugging sequence; write the evidence line that proved the cause.", "Fix each one and confirm Running.", "Write runbook.md with a section per failure: symptoms, commands, causes, fixes."], "ver": "kubectl get pods -n broken     # all Running after fixes", "inc": "A deploy fails across all environments with ImagePullBackOff. describe shows '429 Too Many Requests' from Docker Hub. The cluster hit anonymous pull rate limits. Fix: pull-through cache or private registry mirror, and authenticated pulls.", "dsa": ["Permutations (LeetCode 46)"], "iq": ["What's your step-by-step process when a pod is in CrashLoopBackOff?", "How do you see logs from the previous container instance?", "How do you tell an OOM kill from an application crash?", "List causes of ImagePullBackOff.", "A pod restarts every 30 minutes with exit code 143 and no errors in logs. What's happening?"], "rev": ["Debugging sequence", "Exit codes in K8s", "Pending causes"], "done": "Six broken workloads diagnosed from evidence and fixed; runbook committed.", "res": [{"t": "Kubernetes: Debug pods", "u": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"}, {"t": "Kubernetes: Debug running pods", "u": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/"}]}, {"n": 40, "ph": 4, "topic": "Kubernetes troubleshooting II: DNS, Services and failed rollouts", "time": "35 / 105 / 40", "obj": ["Debug Service connectivity and cluster DNS", "Diagnose stalled rollouts and probe misconfigurations", "Extend the runbook"], "con": ["Service debugging chain: does DNS resolve? does the Service exist? are there endpoints? do pod labels match? is the targetPort right? does the app listen on 0.0.0.0, not 127.0.0.1?", "DNS: check CoreDNS pods and logs, the pod's /etc/resolv.conf, and NetworkPolicies blocking port 53.", "Stalled rollout: new pods never become Ready (bad readiness probe, crash, missing config). progressDeadlineSeconds marks it failed.", "Probe misconfiguration: wrong port or path, timeouts too short for slow startup, liveness restarting healthy-but-busy apps.", "Longest consecutive sequence (DSA): a set allows O(n)."], "cmd": "kubectl run dnsutils --rm -it --image=registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3 -- bash\nnslookup api.default.svc.cluster.local\nkubectl get svc api -o wide; kubectl get endpointslices -l kubernetes.io/service-name=api\nkubectl logs -n kube-system -l k8s-app=kube-dns\nkubectl rollout status deployment/api --timeout=60s\nkubectl get deploy api -o jsonpath='{.status.conditions[*].message}'", "lab": ["Break and diagnose: Service targetPort 8081 instead of 8080; app bound to 127.0.0.1; CoreDNS scaled to 0; readiness probe on the wrong path during a rollout; liveness timeout 1s on an endpoint that takes 2s.", "For each, record symptom, evidence command and fix in the runbook.", "Scale CoreDNS back and note how long resolution failures lasted.", "Time yourself: aim for under 5 minutes per diagnosis."], "ver": "kubectl rollout status deployment/api     # successfully rolled out after fixes", "inc": "A rollout hangs at 1 of 3 new pods for 10 minutes and alerts fire. The new version added a readiness check on /ready, but the probe still pointed at /healthz on the old port. Old pods kept serving (maxUnavailable 0), so users were fine. Lesson: readiness gates are what make rolling updates safe.", "dsa": ["Longest Consecutive Sequence (LeetCode 128)"], "iq": ["Walk through debugging 'service A can't reach service B' in Kubernetes.", "Why would an app work via kubectl port-forward but not via its Service?", "How do you check whether CoreDNS is the problem?", "What does progressDeadlineSeconds do?", "Design probes for a Java service that takes 90 seconds to start and occasionally does 5-second GC pauses."], "rev": ["Service debugging chain", "0.0.0.0 vs 127.0.0.1", "Probe tuning"], "done": "Five more failures diagnosed in under 5 minutes each; runbook extended.", "res": [{"t": "Kubernetes: Debug Services", "u": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"}, {"t": "Kubernetes: Debugging DNS resolution", "u": "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"}]}, {"n": 41, "ph": 4, "topic": "Helm, GitOps and Project 2 completion", "time": "50 / 90 / 40", "obj": ["Package status-api as a Helm chart with configurable values", "Upgrade and roll back releases", "Explain GitOps and drift, and finish Project 2"], "con": ["Helm chart: templates plus values.yaml; a release is an installed instance with revision history.", "helm upgrade --install is idempotent; helm rollback returns to a previous revision; --atomic rolls back automatically on failure.", "Values hold environment differences (replicas, resources, image tag). Manual kubectl edits are overwritten by the next helm upgrade, so changes must go into values.", "GitOps: Git is the source of truth; a controller (Argo CD, Flux) continuously syncs the cluster to Git and reports drift.", "Find median from data stream (DSA): two heaps."], "cmd": "helm create status-api\nhelm lint ./status-api\nhelm template ./status-api -f values-prod.yaml | less\nhelm upgrade --install api ./status-api -f values-dev.yaml --atomic --timeout 2m\nhelm history api; helm rollback api 1\nkubectl create ns argocd\nkubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml", "lab": ["Create the chart; template image tag, replicas, resources, probes and the ConfigMap.", "Install with values-dev.yaml; upgrade to a broken image with --atomic and watch the automatic rollback.", "kubectl edit the replica count, then helm upgrade again and watch it revert. Note why.", "Install Argo CD; create an Application pointing at your chart in Git; change values in Git and watch it sync.", "Project 2 done: README with architecture, pipeline diagram, how to deploy, how to roll back, failure scenarios tested. Tag p2-v1.0."], "ver": "helm history api                 # shows the failed and rolled-back revisions\nkubectl -n argocd get applications", "inc": "An engineer raised memory limits with kubectl edit during an incident. The next Helm deploy silently reverted it and the OOMKills returned the following night. Rule: every live patch must be carried into Helm values (or the operator's config) the same day.", "dsa": ["Find Median from Data Stream (LeetCode 295)"], "iq": ["What problem does Helm solve?", "What does --atomic do?", "Why do kubectl edits get reverted?", "What is GitOps, and what is drift?", "How would you roll back a bad release in a GitOps setup?"], "rev": ["Helm commands", "Values vs live edits", "GitOps pull model"], "done": "Chart deploys and auto-rolls back; Argo CD syncs from Git; Project 2 tagged.", "res": [{"t": "Helm docs", "u": "https://helm.sh/docs/"}, {"t": "Argo CD getting started", "u": "https://argo-cd.readthedocs.io/en/stable/getting_started/"}]}, {"n": 42, "ph": 5, "topic": "AWS fundamentals and IAM (Week 6 assessment)", "time": "60 / 60 / 60", "obj": ["Explain regions, AZs and the shared responsibility model", "Write least-privilege IAM policies and use roles", "Set up billing safety, and complete the Week 6 assessment"], "con": ["Region: a geographic area with several Availability Zones (AZs), which are isolated data centres. Design for AZ failure.", "Shared responsibility: AWS secures the cloud (hardware, hypervisor); you secure what's in it (IAM, OS patches, data).", "IAM: users (avoid for humans; use SSO), groups, roles (assumed with temporary credentials), policies (JSON allow/deny).", "Evaluation: explicit Deny beats Allow; default is deny.", "Root account: MFA, no access keys, use only for account tasks.", "COST WARNING: from today some labs can incur charges. Set a budget alarm before anything else."], "cmd": "aws configure sso          # or aws configure for a lab-only IAM user\naws sts get-caller-identity\naws budgets create-budget --account-id <id> --budget '{\"BudgetName\":\"lab\",\"BudgetLimit\":{\"Amount\":\"10\",\"Unit\":\"USD\"},\"TimeUnit\":\"MONTHLY\",\"BudgetType\":\"COST\"}' \\\n  --notifications-with-subscribers '[{\"Notification\":{\"NotificationType\":\"ACTUAL\",\"ComparisonOperator\":\"GREATER_THAN\",\"Threshold\":80},\"Subscribers\":[{\"SubscriptionType\":\"EMAIL\",\"Address\":\"you@example.com\"}]}]'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\"Effect\": \"Allow\", \"Action\": [\"s3:GetObject\"], \"Resource\": \"arn:aws:s3:::my-bucket/reports/*\"}]\n}\naws iam simulate-principal-policy --policy-source-arn <role-arn> --action-names s3:GetObject --resource-arns arn:aws:s3:::my-bucket/reports/a.csv", "lab": ["Enable MFA on root; create an admin via IAM Identity Center (or a lab IAM user with MFA).", "Create a $10 monthly budget with an email alert at 80%.", "Create a role assumable by EC2 that can only read one S3 prefix; test it with simulate-principal-policy.", "Write a policy with an explicit Deny on s3:DeleteBucket and show it overrides an Allow.", "Week 6 assessment, 60 minutes: Kubernetes troubleshooting scenarios (3), Helm vs live edits, GitOps, IAM basics, one timed coding problem. Score and mark weak days."], "ver": "aws sts get-caller-identity       # shows your identity\naws budgets describe-budgets --account-id <id>", "inc": "An access key committed to a public GitHub repo was used within minutes to launch crypto-mining instances in every region. Response: deactivate the key, check CloudTrail, terminate resources, rotate secrets. Prevention: no long-lived keys, use SSO/roles, secret scanning, SCPs restricting regions.", "dsa": ["Jump Game (LeetCode 55): greedy"], "iq": ["What is an Availability Zone, and why deploy across several?", "IAM user vs role?", "How does IAM evaluate an explicit Deny vs Allow?", "What is the shared responsibility model?", "An access key leaked publicly. What do you do in the first 15 minutes?"], "rev": ["Region/AZ", "Policy evaluation order", "Root account hygiene"], "done": "Budget alarm active; least-privilege role tested; Week 6 score logged.", "res": [{"t": "AWS IAM User Guide", "u": "https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html"}, {"t": "AWS Well-Architected: Reliability Pillar", "u": "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html"}]}, {"n": 43, "ph": 5, "topic": "VPC deep dive", "time": "60 / 80 / 40", "obj": ["Design a multi-AZ VPC with public and private subnets", "Explain route tables, IGW, NAT gateway and VPC endpoints", "Use VPC Flow Logs to debug connectivity"], "con": ["Public subnet: its route table sends 0.0.0.0/0 to an Internet Gateway. Private subnet: sends 0.0.0.0/0 to a NAT gateway (outbound only).", "NAT gateways are per AZ; one shared NAT is a single point of failure and creates cross-AZ data charges.", "Security groups (stateful, attached to ENIs, allow only) vs NACLs (stateless, per subnet, allow and deny).", "VPC endpoints: gateway endpoints (S3, DynamoDB, free) and interface endpoints (PrivateLink, hourly cost) keep traffic off the internet and NAT.", "Flow logs record accepted and rejected traffic for ENIs, subnets or the VPC.", "COST WARNING: a NAT gateway costs money per hour plus per GB. Delete it at the end of the lab."], "cmd": "aws ec2 create-vpc --cidr-block 10.0.0.0/16\naws ec2 describe-route-tables --filters Name=vpc-id,Values=<vpc-id>\naws ec2 create-flow-logs --resource-type VPC --resource-ids <vpc-id> --traffic-type REJECT \\\n  --log-destination-type cloud-watch-logs --log-group-name vpc-rejects --deliver-logs-permission-arn <role-arn>\n# Cleanup\naws ec2 delete-nat-gateway --nat-gateway-id <id>\naws ec2 release-address --allocation-id <eip-alloc>", "lab": ["Using the console's 'VPC and more' wizard, create a VPC with 2 AZs, public and private subnets, 1 NAT gateway and an S3 gateway endpoint. Study every route table it made.", "Launch a t3.micro (free tier eligible) in a private subnet with SSM access (no SSH key); connect with Session Manager and curl the internet through NAT.", "Remove the NAT route and show internet access fails while S3 access still works via the endpoint.", "Enable flow logs for REJECT traffic; block a port in a security group and find the reject record.", "Cleanup: terminate the instance, delete the NAT gateway, release the Elastic IP, delete the VPC."], "ver": "aws ec2 describe-nat-gateways --query 'NatGateways[].State'    # deleted\naws ec2 describe-addresses                                      # no leftover EIPs", "inc": "Your monthly bill shows a large 'NAT Gateway data processing' charge. Containers in private subnets pull images and write logs to S3 through NAT. Fix: S3 gateway endpoint, ECR interface endpoints, and a per-AZ NAT so traffic doesn't cross AZs.", "dsa": ["Gas Station (LeetCode 134): greedy"], "iq": ["Public vs private subnet: what actually makes a subnet public?", "Why would you deploy one NAT gateway per AZ?", "Security group vs NACL?", "What is a VPC endpoint and why use one?", "An EC2 instance in a private subnet can't reach the internet. Walk through every layer you'd check."], "rev": ["Route table rules", "Endpoint types", "Flow log usage"], "done": "Private instance reached S3 via endpoint without NAT; all billable resources deleted.", "res": [{"t": "Amazon VPC User Guide", "u": "https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"}, {"t": "VPC Flow Logs", "u": "https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"}]}, {"n": 44, "ph": 5, "topic": "EC2, Auto Scaling and load balancers", "time": "55 / 85 / 40", "obj": ["Launch instances from launch templates with user data", "Configure an Auto Scaling group with health checks and scaling policies", "Put an ALB in front with target groups"], "con": ["Launch template: AMI, instance type, security groups, IAM instance profile, user data (bootstrap script).", "Auto Scaling group (ASG): keeps desired capacity across AZs, replaces unhealthy instances. Use ELB health checks so app failures count, not only EC2 status.", "Scaling: target tracking (keep CPU at 50%), step scaling, scheduled scaling. Warm-up and cooldown prevent flapping.", "ALB: L7, listeners and rules route to target groups; health check path, thresholds, deregistration delay.", "Instance types: burstable t3 (CPU credits), general m, compute c, memory r. Running out of t3 credits looks like sudden slowness.", "COST WARNING: ALB is billed hourly; t3.micro may be free-tier eligible. Delete at the end."], "cmd": "#!/bin/bash\n# user data\ndnf install -y python3\ncat > /opt/app.py <<'EOF'\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nimport socket\nclass H(BaseHTTPRequestHandler):\n    def do_GET(self):\n        self.send_response(200); self.end_headers(); self.wfile.write(socket.gethostname().encode())\nHTTPServer((\"\", 80), H).serve_forever()\nEOF\nnohup python3 /opt/app.py &\n\naws autoscaling describe-auto-scaling-groups --auto-scaling-group-names web\naws elbv2 describe-target-health --target-group-arn <tg-arn>", "lab": ["Create a launch template using Amazon Linux 2023 and the user data above.", "Create an ASG (min 2, desired 2, max 4) across 2 AZs with ELB health checks, behind an ALB.", "curl the ALB DNS name repeatedly; see two hostnames.", "Stop the app on one instance (via SSM); watch the target become unhealthy and the ASG replace it.", "Add a target tracking policy at 50% CPU; generate CPU load and watch a scale-out.", "Cleanup: delete the ASG, ALB, target group and launch template."], "ver": "aws elbv2 describe-target-health --target-group-arn <tg-arn>    # healthy, then unhealthy, then replaced", "inc": "An ASG kept terminating and relaunching instances in a loop. The health check grace period (30 s) was shorter than the app's boot time (3 minutes), so new instances were marked unhealthy before they were ready. Fix: a longer grace period or lifecycle hooks.", "dsa": ["Partition Labels (LeetCode 763)"], "iq": ["What is user data and when does it run?", "EC2 health checks vs ELB health checks in an ASG?", "Target tracking vs step scaling?", "What happens when a t3 instance runs out of CPU credits?", "Instances get replaced in a loop right after launch. What do you check?"], "rev": ["ASG health check types", "Scaling policies", "Deregistration delay"], "done": "Self-healing ASG demonstrated behind an ALB; all resources deleted.", "res": [{"t": "Amazon EC2 Auto Scaling User Guide", "u": "https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html"}, {"t": "Application Load Balancer guide", "u": "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html"}]}, {"n": 45, "ph": 5, "topic": "S3, RDS and Route 53", "time": "60 / 75 / 45", "obj": ["Configure S3 versioning, lifecycle and access controls", "Compare RDS Multi-AZ and read replicas", "Use Route 53 routing policies and health checks"], "con": ["S3: object storage with 11 nines durability. Block Public Access on by default; versioning protects against overwrites and deletes; lifecycle rules move or expire objects.", "Storage classes: Standard, Intelligent-Tiering, Standard-IA, Glacier tiers. Cheaper storage has retrieval costs.", "RDS Multi-AZ: synchronous standby in another AZ with automatic failover (about 1-2 minutes) for availability. Read replicas: asynchronous copies for read scaling; replica lag is possible.", "Backups: automated snapshots plus point-in-time recovery; test restores.", "Route 53 routing: simple, weighted (canaries), latency-based, failover (with health checks), geolocation.", "Unique Paths (DSA): grid DP."], "cmd": "aws s3api create-bucket --bucket <unique-name> --region us-east-1\naws s3api put-bucket-versioning --bucket <name> --versioning-configuration Status=Enabled\naws s3api put-bucket-lifecycle-configuration --bucket <name> --lifecycle-configuration file://lifecycle.json\naws s3 cp f.txt s3://<name>/ ; aws s3 rm s3://<name>/f.txt\naws s3api list-object-versions --bucket <name> --prefix f.txt\naws rds describe-db-instances --query 'DBInstances[].{id:DBInstanceIdentifier,multiaz:MultiAZ}'", "lab": ["Create a versioned bucket; upload, overwrite and delete a file; restore the original by removing the delete marker.", "Add a lifecycle rule moving objects to Standard-IA after 30 days and expiring old versions after 90.", "Read the RDS docs and write a comparison table: Multi-AZ vs read replica vs Aurora (failover time, consistency, cost). Creating RDS is optional; if you do, use the free tier and delete it.", "Create a Route 53 health check against a public URL and describe how failover routing would use it (a hosted zone costs money monthly; documenting is enough).", "Cleanup: empty and delete the bucket including versions."], "ver": "aws s3api list-object-versions --bucket <name>    # shows versions and delete marker", "inc": "A deployment script ran aws s3 sync --delete against the wrong prefix and deleted 40,000 customer documents. Versioning was on, so a script restored previous versions in 2 hours. Without versioning the data would be gone. Lesson: versioning, MFA delete or Object Lock for critical buckets, and least-privilege delete permissions.", "dsa": ["Unique Paths (LeetCode 62)"], "iq": ["How do you protect S3 data from accidental deletion?", "RDS Multi-AZ vs read replicas?", "What is replica lag and how does it affect applications?", "Name Route 53 routing policies and when to use each.", "Design backups for a production Postgres with RPO 5 minutes and RTO 1 hour."], "rev": ["S3 protections", "Multi-AZ vs replicas", "Routing policies"], "done": "Deleted object restored from versions; RDS comparison table written; bucket cleaned up.", "res": [{"t": "Amazon S3 User Guide", "u": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"}, {"t": "Amazon RDS Multi-AZ", "u": "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html"}]}, {"n": 46, "ph": 5, "topic": "CloudWatch and EKS architecture", "time": "60 / 75 / 45", "obj": ["Use CloudWatch metrics, logs and alarms", "Explain EKS architecture, node groups and pod IAM", "Know when to use EKS vs self-managed vs serverless"], "con": ["CloudWatch metrics: namespaces, dimensions, statistics (Average, p99), periods. Default EC2 metrics don't include memory or disk; the CloudWatch agent adds them.", "CloudWatch Logs: log groups and streams; Logs Insights queries; set retention or pay forever.", "Alarms: threshold over N of M periods; treat missing data deliberately (notBreaching vs breaching).", "EKS: AWS runs the control plane; you run nodes (managed node groups, self-managed, Karpenter, or Fargate).", "Pod IAM: IRSA (OIDC-based roles per ServiceAccount) or EKS Pod Identity. Never give the node role broad permissions.", "COST WARNING: an EKS cluster is billed hourly plus nodes and NAT. Today is design and reading; Project 4 uses kind locally and EKS only optionally."], "cmd": "aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name CPUUtilization \\\n  --dimensions Name=InstanceId,Value=<id> --start-time 2026-01-01T00:00:00Z --end-time 2026-01-01T01:00:00Z \\\n  --period 300 --statistics Average\naws logs start-query --log-group-name /app/api --start-time $(date -d '-1 hour' +%s) --end-time $(date +%s) \\\n  --query-string 'fields @timestamp, @message | filter @message like /ERROR/ | stats count() by bin(5m)'\neksctl create cluster --name lab --region us-east-1 --nodes 2 --node-type t3.medium   # optional, billable\neksctl delete cluster --name lab --region us-east-1", "lab": ["Create a log group with 7-day retention; push test events with aws logs put-log-events (or the CloudWatch agent on a free-tier instance).", "Write a Logs Insights query counting ERROR lines per 5 minutes.", "Create a CloudWatch alarm on a custom metric (aws cloudwatch put-metric-data) with 3 of 5 datapoints and missing data as notBreaching; trigger it.", "Draw the EKS architecture: control plane, VPC CNI pod IPs, node groups, IRSA, AWS Load Balancer Controller, EBS CSI.", "Optional (billable, about an hour): eksctl create cluster, deploy status-api, then eksctl delete cluster."], "ver": "aws cloudwatch describe-alarms --alarm-names lab-alarm --query 'MetricAlarms[].StateValue'", "inc": "An alarm on 'disk space' never fired before a server ran out of disk: the default EC2 metrics don't include disk usage, and the alarm's missing data setting was notBreaching, so it sat in OK. Fix: install the CloudWatch agent and treat missing data deliberately.", "dsa": ["Longest Increasing Subsequence (LeetCode 300)"], "iq": ["Which EC2 metrics are not available by default?", "How should an alarm treat missing data, and why does it matter?", "EKS managed node groups vs Fargate vs Karpenter?", "What is IRSA and why is it better than node IAM roles?", "Pods on EKS can't get IPs even though nodes have spare CPU. Why? (VPC CNI IP exhaustion, max pods per ENI)"], "rev": ["Missing data handling", "EKS components", "IRSA"], "done": "Logs Insights query and a firing alarm demonstrated; EKS diagram committed.", "res": [{"t": "Amazon CloudWatch User Guide", "u": "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html"}, {"t": "EKS Best Practices Guide", "u": "https://docs.aws.amazon.com/eks/latest/best-practices/introduction.html"}]}, {"n": 47, "ph": 5, "topic": "Terraform fundamentals", "time": "55 / 85 / 40", "obj": ["Write Terraform with providers, resources, variables and outputs", "Run the plan/apply/destroy workflow safely", "Understand what state is and why it matters"], "con": ["Terraform declares infrastructure in HCL; plan shows the diff between code, state and reality; apply makes it so.", "Providers talk to APIs (aws, kubernetes). Resources are things to create; data sources read existing things.", "Variables and outputs make modules reusable; locals simplify expressions.", "State maps code to real resource IDs. Losing or corrupting state is dangerous; never edit it by hand.", "Always read the plan, especially lines with 'must be replaced' (destroy then create).", "Decode Ways (DSA): DP over a string."], "cmd": "terraform {\n  required_providers { aws = { source = \"hashicorp/aws\", version = \"~> 5.0\" } }\n}\nprovider \"aws\" { region = var.region }\nvariable \"region\" { default = \"us-east-1\" }\nresource \"aws_vpc\" \"main\" {\n  cidr_block = \"10.0.0.0/16\"\n  tags = { Name = \"sre-lab\" }\n}\nresource \"aws_subnet\" \"private\" {\n  count             = 2\n  vpc_id            = aws_vpc.main.id\n  cidr_block        = cidrsubnet(aws_vpc.main.cidr_block, 4, count.index)\n  availability_zone = data.aws_availability_zones.az.names[count.index]\n}\ndata \"aws_availability_zones\" \"az\" { state = \"available\" }\noutput \"vpc_id\" { value = aws_vpc.main.id }\n\nterraform init && terraform fmt && terraform validate\nterraform plan -out tfplan && terraform apply tfplan\nterraform state list; terraform destroy", "lab": ["Project 4 kickoff: create projects/p4-sre-platform/infra with the VPC and 2 private subnets (no NAT, to stay free).", "Run init, fmt, validate, plan, apply. Read every line of the plan.", "Change the VPC CIDR and read the plan: note 'forces replacement'. Revert.", "Add public subnets, an IGW and route tables; apply.", "terraform destroy at the end of the day."], "ver": "terraform output vpc_id\nterraform state list      # vpc, subnets, igw, route tables", "inc": "An engineer changed a resource name in code and ran apply without reading the plan. Terraform destroyed and recreated the production database security group, dropping connections for 5 minutes. Fix: moved blocks (or terraform state mv), required plan review in CI, prevent_destroy on critical resources.", "dsa": ["Decode Ways (LeetCode 91)"], "iq": ["What is Terraform state and why is it needed?", "What does terraform plan compare?", "What does 'forces replacement' mean in a plan?", "How do you rename a resource without destroying it?", "How would you prevent someone from accidentally destroying production with Terraform?"], "rev": ["Workflow commands", "State purpose", "Replacement triggers"], "done": "VPC created and destroyed via Terraform; replacement plan understood.", "res": [{"t": "Terraform tutorials: AWS get started", "u": "https://developer.hashicorp.com/terraform/tutorials/aws-get-started"}, {"t": "Terraform language docs", "u": "https://developer.hashicorp.com/terraform/language"}]}, {"n": 48, "ph": 5, "topic": "Terraform modules, remote state and drift", "time": "50 / 90 / 40", "obj": ["Structure code into modules", "Store state remotely with locking", "Detect and handle drift, and run Terraform in CI"], "con": ["Module: a folder of Terraform with inputs and outputs. Root modules call child modules; pin module versions.", "Remote state in S3 with locking (S3 native lockfile in newer Terraform versions, or a DynamoDB table in older setups) lets a team work safely.", "Separate state per environment (dev, prod) to limit blast radius.", "Drift: reality changed outside Terraform (console edits). terraform plan -refresh-only shows it; decide to adopt it in code or revert it.", "terraform import (or import blocks) brings existing resources under management.", "Word Break (DSA): DP over prefixes."], "cmd": "terraform {\n  backend \"s3\" {\n    bucket       = \"<unique-tf-state-bucket>\"\n    key          = \"p4/dev/terraform.tfstate\"\n    region       = \"us-east-1\"\n    use_lockfile = true      # S3 native locking (Terraform 1.10+)\n    encrypt      = true\n  }\n}\nmodule \"network\" {\n  source   = \"./modules/network\"\n  cidr     = \"10.0.0.0/16\"\n  az_count = 2\n}\nterraform plan -refresh-only\nterraform plan -detailed-exitcode; echo $?    # 0 no changes
